name: Deploy Hai Tay Phat website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main-site
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy main website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build production app
        run: bun run build

      - name: Verify Cloudflare output
        run: |
          test -f .output/server/index.mjs
          test -d .output/public

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3724ab9be081e7e42c70577f5117519e"
        run: bunx --yes wrangler@4 deploy --config wrangler.jsonc
