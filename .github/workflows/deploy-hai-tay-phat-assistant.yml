name: Deploy Hai Tay Phat AI Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/assistant-orchestrator/**"
      - ".github/workflows/deploy-hai-tay-phat-assistant.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment credential
        id: credential
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Set repository secret CLOUDFLARE_API_TOKEN to enable automatic deployment."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: steps.credential.outputs.available == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Wrangler
        if: steps.credential.outputs.available == 'true'
        run: bun add --global wrangler

      - name: Deploy Worker to Cloudflare
        if: steps.credential.outputs.available == 'true'
        working-directory: workers/assistant-orchestrator
        run: wrangler deploy --config wrangler.jsonc
