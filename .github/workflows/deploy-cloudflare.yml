name: Deploy site to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Build-time public env (set in GitHub Secrets if khác mặc định)
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare credential
        id: credential
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Thiếu secret CLOUDFLARE_API_TOKEN — bỏ qua deploy. Thêm token tại Settings → Secrets and variables → Actions."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: steps.credential.outputs.available == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.credential.outputs.available == 'true'
        run: bun install --frozen-lockfile

      - name: Build production
        if: steps.credential.outputs.available == 'true'
        run: bun run build

      - name: Deploy to Cloudflare
        if: steps.credential.outputs.available == 'true'
        run: bunx wrangler deploy --config wrangler.jsonc
