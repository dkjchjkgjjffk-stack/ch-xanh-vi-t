name: Sync agricultural prices

on:
  schedule:
    # 07:15 Vietnam time (00:15 UTC), daily
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-agricultural-prices
  cancel-in-progress: false

jobs:
  sync:
    name: Sync prices from configured sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request Supabase price sync
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --location \
            --max-time 180 \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{}' \
            "https://syeivjiceluygqvjeblw.supabase.co/functions/v1/sync-agricultural-prices")"
          cat "$response_file"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Price sync endpoint returned HTTP $status"
            exit 1
          fi
