name: Quality checks

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint source (formatting rule excluded until legacy formatting is cleaned)
        run: bunx eslint . --rule=prettier/prettier:off
      - name: Run tests
        run: bun run test
      - name: Build production
        run: bun run build
